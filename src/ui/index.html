<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mac Health</title>
<style>
/* Color has one job each: blue = act, green = healthy, amber = needs a look, red = urgent, violet = learn. Everything else is a navy tint. */
:root {
  color-scheme: light;
  --bg: #e7ecf4; --surface: #f8fafd; --surface-2: #e6ebf3; --line: #cdd6e4;
  --text: #12213b; --text-2: #40506b; --text-3: #566681;
  --accent: #1b5fb3; --accent-fill: #1f68c2; --accent-ink: #ffffff; --accent-bg: #dbe8f8; --series: #1f68c2;
  --good: #0b6e41; --good-bg: #d9f0e4;
  --warn: #855500; --warn-bg: #f9ecd0; --warn-line: #e3b95f;
  --bad: #b82525; --bad-bg: #f9e0df;
  --violet: #5242bd; --violet-bg: #e6e4f8; --key: #5242bd; --str: #0b6e41; --num: #a54e0c;
  --monitor: #10233f; --monitor-line: #2c4263; --monitor-text: #f1f5fb; --monitor-text-2: #b5c3d8;
  --display: "Avenir Next", Avenir, -apple-system, "Helvetica Neue", sans-serif;
  --rail: 196px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #141d2e; --surface: #1c2739; --surface-2: #29364c; --line: #35445e;
    --text: #edf2fa; --text-2: #bdc9db; --text-3: #9aa9c1;
    --accent: #79b2f5; --accent-bg: #1c3555; --series: #79b2f5;
    --good: #5fd6a0; --good-bg: #15352a;
    --warn: #edc064; --warn-bg: #3a2f15; --warn-line: #8a6d2a;
    --bad: #f59393; --bad-bg: #421f22;
    --violet: #b0a7f5; --violet-bg: #2b2857; --key: #b0a7f5; --str: #5fd6a0; --num: #efa76d;
    --monitor: #0c1a30;
  }
  .monitor { border: 1px solid var(--monitor-line); }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
body { margin: 0; min-height: 100vh; display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
button, select { font: inherit; color: inherit; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.top { position: sticky; top: 0; z-index: 10; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
.bar { display: flex; flex-direction: column; gap: 14px; padding: 20px 10px 16px; }
.bar nav { flex: 1; min-width: 0; }
h1, h2, h3 { font-family: var(--display); }
h1 { font-size: 19px; font-weight: 700; margin: 0; padding: 0 8px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 7px; }
h1 svg.i { width: 21px; height: 21px; }
h2 { font-size: 28px; font-weight: 700; line-height: 1.15; margin: 0; letter-spacing: -0.015em; }
h3 { font-size: 16px; font-weight: 600; margin: 0; }
dialog h2 { font-size: 22px; }
.spacer { flex: 1; }
.muted { color: var(--text-2); }
.small { font-size: 13px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.1); background: var(--accent-fill); }
.btn.danger { background: #b82525; border-color: #b82525; color: #fff; font-weight: 600; }
.btn.sm { padding: 5px 11px; font-size: 13px; }
.btn:disabled { opacity: .55; cursor: default; }
.btn:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, .tab:focus-visible, .tile-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
nav { display: flex; flex-direction: column; gap: 1px; }
.tab { display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 8px; background: none; border: 0; border-radius: 7px; cursor: pointer; color: var(--text-2); white-space: nowrap; font-size: 14px; text-align: left; }
.tab svg.i { width: 15px; height: 15px; }
.tab:hover { background: var(--surface-2); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
.tab[data-tab="alerts"], .tab[data-tab="history"] { margin-top: 14px; }
.count { margin-left: auto; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--surface-2); font-size: 11px; line-height: 18px; text-align: center; font-weight: 700; }
.tab[aria-selected="true"] .count:not(.bad):not(.warn) { background: var(--bg); }
.count.bad { background: #b82525; color: #fff; }
.count.warn { background: var(--warn-bg); color: var(--warn); }
main { width: 100%; max-width: 1020px; margin: 0 auto; padding: 32px 36px 110px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.page-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 18px; }
/* A badge is a colored icon, never a filled block. */
.badge { display: inline-flex; align-items: center; justify-content: center; width: 24px; flex: none; color: var(--text-3); font-family: var(--display); }
.badge.good { color: var(--good); }
.badge.warn { color: var(--warn); }
.badge.bad { color: var(--bad); }
.badge.act { color: var(--accent); }
.badge.learn { color: var(--violet); }
.page-head > div { flex: 1 1 220px; min-width: 0; }
.page-head .badge svg.i { width: 24px; height: 24px; }
.sub { font-size: 13px; color: var(--text-2); }
.page-head .sub { font-size: 14px; margin-top: 2px; }
/* The monitor is the one bold thing: dark in both themes, like the screen beside a hospital bed. */
.monitor { --tone: #62e0a6; background: var(--monitor); color: var(--monitor-text); border-radius: 18px; padding: 26px 28px 20px; }
.monitor.warn { --tone: #f5c563; }
.monitor.bad { --tone: #ff9a9a; }
.mon-head { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-start; justify-content: space-between; }
.mon-head h2 { font-size: 32px; }
.mon-sub { margin-top: 4px; font-size: 14px; color: var(--monitor-text-2); max-width: 62ch; }
.mon-read { display: flex; align-items: flex-end; gap: 22px; margin-top: 12px; }
.score { font: 700 112px/.92 var(--display); letter-spacing: -0.045em; font-variant-numeric: lining-nums; color: var(--tone); flex: none; }
.trace { display: block; flex: 1; min-width: 0; height: 96px; }
.trace.draw { animation: trace 1.4s ease-out both; }
@keyframes trace { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0); } }
@media (prefers-reduced-motion: reduce) { .trace.draw { animation: none; } }
.mon-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--monitor-line); font-size: 13px; color: var(--monitor-text-2); }
.monitor .btn:not(.primary) { background: none; border-color: var(--monitor-line); color: var(--monitor-text); }
.monitor .btn:not(.primary):hover { background: var(--monitor-line); }
.monitor .btn:focus-visible { outline-color: #fff; }
.monitor .btn.primary { background: #2672cf; border-color: #2672cf; }
.next { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 14px 0; padding: 14px 18px; box-shadow: inset 3px 0 0 var(--accent); }
.next-text { flex: 1; min-width: 220px; }
.next-text h3 { font-size: 18px; }
/* One ruled panel of readings, not a grid of separate cards. */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.tiles.three { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-bottom: 14px; }
.tile, .tile.btn { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; background: none; border: 0; border-radius: 0; margin: 0 -1px -1px 0; box-shadow: inset -1px -1px 0 var(--line); padding: 14px 16px; min-width: 0; text-align: left; width: auto; }
.tile-link { cursor: pointer; }
.tile.btn:hover { background: var(--surface-2); }
.tile-link:focus-visible { outline-offset: -3px; }
.tile .badge { width: auto; }
.tile b { display: block; font: 600 21px/1.2 var(--display); letter-spacing: -0.01em; }
.tile span.lab { display: block; font-size: 12.5px; color: var(--text-2); margin-top: 1px; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-bottom: 14px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill svg.i { width: 12px; height: 12px; }
.pill.high { background: var(--bad-bg); color: var(--bad); }
.pill.medium { background: var(--warn-bg); color: var(--warn); }
.pill.low { background: var(--accent-bg); color: var(--accent); }
.pill.safe { background: var(--good-bg); color: var(--good); }
.pill.neutral { background: var(--surface-2); color: var(--text-2); }
.pill.violet { background: var(--violet-bg); color: var(--violet); }
.row-list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 11px; align-items: center; padding: 13px 16px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row.sev-high { box-shadow: inset 3px 0 0 var(--bad); }
.row.sev-medium, .row.outlier { box-shadow: inset 3px 0 0 var(--warn-line); }
.row.selected { background: var(--accent-bg); box-shadow: inset 3px 0 0 var(--accent); }
.row input[type=checkbox] { width: 17px; height: 17px; margin: 0; accent-color: var(--accent-fill); }
.row-title { font-weight: 600; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row-side { display: flex; align-items: center; gap: 10px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row-body { grid-column: 2 / 4; font-size: 14px; color: var(--text-2); }
.row .badge { font-size: 20px; font-weight: 700; }
.hint { display: flex; gap: 5px; align-items: flex-start; margin-top: 3px; font-size: 13px; color: var(--violet); }
.hint svg.i { width: 14px; height: 14px; margin-top: 2px; }
details { margin-top: 4px; font-size: 13px; }
summary { cursor: pointer; color: var(--text-3); }
pre { margin: 6px 0 0; padding: 10px; border-radius: 8px; background: var(--surface-2); overflow-x: auto; font: 12px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text); }
.k { color: var(--key); } .s { color: var(--str); } .n { color: var(--num); }
.group-title { display: flex; align-items: center; gap: 6px; margin: 22px 0 8px; font: 600 15px var(--display); color: var(--text-2); }
.clear { display: flex; align-items: center; gap: 12px; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.clear .badge svg.i { width: 24px; height: 24px; }
.clear h3 { font-size: 18px; }
.nudge { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); }
.empty { padding: 32px; text-align: center; color: var(--text-2); }
.notice { padding: 9px 14px; border-radius: 10px; background: var(--accent-bg); margin-bottom: 12px; font-size: 14px; }
.notice.bad { background: var(--bad-bg); }
.notice.ok { background: var(--good-bg); }
.notice.warn { background: var(--warn-bg); }
.tray { position: fixed; z-index: 10; left: var(--rail); right: 0; bottom: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 36px; background: var(--surface); border-top: 1px solid var(--line); }
.progress { margin-top: auto; padding: 12px 18px; }
.progress-bar { height: 5px; border-radius: 4px; background: var(--surface-2); overflow: hidden; margin-top: 5px; }
.progress-bar div { height: 100%; border-radius: 4px; background: var(--series); transition: width .4s; }
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--text); max-width: 620px; width: calc(100% - 32px); padding: 22px; }
dialog::backdrop { background: rgba(12,26,48,.55); }
dialog ul { max-height: 240px; overflow: auto; padding-left: 18px; font-size: 14px; }
.dialog-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.result { display: flex; gap: 8px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.result:first-child { border-top: 0; }
.perm { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 11px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
.perm:first-of-type { border-top: 0; }
.perm-side { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; }
.check-list { list-style: none; margin: 8px 0 0; padding: 0; font-size: 14px; }
.check-list li { display: flex; gap: 7px; padding: 3px 0; }
.check-list svg.i { width: 15px; height: 15px; margin-top: 3px; }
.steps { margin: 8px 0 0; padding-left: 20px; font-size: 14px; }
.table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.table th, .table td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); }
.table th { color: var(--text-2); font-weight: 500; font-size: 13px; }
.chart-wrap { position: relative; }
.chart-wrap svg { display: block; width: 100%; height: 150px; }
.grid-line { stroke: var(--line); stroke-width: 1; }
.axis { display: flex; justify-content: space-between; color: var(--text-3); font-size: 12px; margin-top: 2px; }
.chart-tip { position: absolute; pointer-events: none; padding: 5px 9px; border-radius: 7px; background: var(--text); color: var(--bg); font-size: 12px; white-space: nowrap; transform: translate(-50%, -115%); display: none; }
/* Narrow windows: the rail becomes a pinned strip that scrolls sideways. */
@media (max-width: 820px) {
  body { display: block; }
  .top { height: auto; overflow: visible; border-right: 0; border-bottom: 1px solid var(--line); background: var(--bg); }
  .bar { gap: 6px; padding: 10px 0 6px; }
  h1 { padding: 0 16px; font-size: 17px; }
  nav { flex-direction: row; overflow-x: auto; padding: 0 10px; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  .tab { width: auto; flex: none; }
  .tab[aria-selected="true"] { box-shadow: inset 0 -3px 0 var(--accent); }
  .tab[data-tab="alerts"], .tab[data-tab="history"] { margin-top: 0; margin-left: 10px; }
  .count { margin-left: 2px; }
  .progress { margin-top: 0; padding: 6px 16px 10px; }
  main { padding: 22px 24px 110px; }
  .tray { left: 0; padding: 10px 24px; }
}
@media (max-width: 640px) {
  main { padding-left: 16px; padding-right: 16px; }
  .tray { padding: 10px 16px; }
  h2 { font-size: 24px; }
  .monitor { padding: 20px 18px 16px; }
  .mon-head h2 { font-size: 26px; }
  .mon-read { flex-direction: column; align-items: stretch; gap: 8px; }
  .score { font-size: 84px; }
  .trace { flex: none; width: 100%; height: 66px; }
  .tiles, .tiles.three { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tile, .tile.btn { padding: 12px 14px; }
  .tile b { font-size: 18px; }
  .row { grid-template-columns: auto minmax(0, 1fr); padding: 12px 14px; }
  .row-side { grid-column: 2; order: 3; white-space: normal; flex-wrap: wrap; margin-top: 6px; }
  .row-side:empty { display: none; }
  .row-body { grid-column: 2; }
  .perm { grid-template-columns: auto minmax(0, 1fr); }
  .perm-side { grid-column: 2; justify-content: flex-start; }
}
</style>
</head>
<body>
<div class="top">
  <div class="bar"><h1 id="brand"></h1><nav id="tabs" role="tablist" aria-label="Pages" aria-orientation="vertical"></nav></div>
  <div class="progress" id="progress" hidden>
    <div id="progress-stage" class="small muted"></div>
    <div class="progress-bar" id="progress-meter" role="progressbar" aria-label="Scan progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-fill" style="width:0"></div></div>
  </div>
</div>
<main id="main" role="tabpanel"></main>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>
<div class="tray" id="tray" hidden>
  <strong id="tray-text"></strong>
  <span class="muted small">Goes to Trash, so you can restore it.</span>
  <span class="spacer"></span>
  <button class="btn" id="tray-clear">Clear</button>
  <button class="btn primary" id="tray-go">Review and move to Trash</button>
</div>
<dialog id="confirm">
  <h2 id="confirm-title"></h2>
  <p class="muted small" id="confirm-body"></p>
  <ul id="confirm-list"></ul>
  <div class="dialog-actions">
    <button class="btn" id="confirm-cancel">Cancel</button>
    <button class="btn primary" id="confirm-go"></button>
  </div>
</dialog>
<dialog id="job">
  <h2 tabindex="-1" autofocus>Homebrew updates</h2>
  <div id="job-summary" style="margin-top:8px"></div>
  <details id="job-details"><summary>Show the full log</summary><pre id="job-log" style="max-height:280px;overflow:auto"></pre></details>
  <div class="dialog-actions" id="job-actions"></div>
</dialog>
<script>

const TOKEN = location.hash.slice(1);

function historyChart(id, title, rows, valueOf, format, fixedMax) {
  const W = 640, H = 150, L = 8, R = 8, T = 12, B = 8;
  const values = rows.map(valueOf);
  const low = fixedMax != null ? 0 : Math.min(...values) * 0.97;
  const high = fixedMax != null ? fixedMax : Math.max(...values) * 1.03 || 1;
  const x = i => rows.length === 1 ? W / 2 : L + i * (W - L - R) / (rows.length - 1);
  const y = v => T + (1 - (v - low) / ((high - low) || 1)) * (H - T - B);
  const points = values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const fmt = s => new Date(s * 1000).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  return `<div class="card"><h3>${esc(title)}</h3><div class="small muted">Latest: ${esc(format(values[values.length - 1]))}</div>
    <div class="chart-wrap" data-chart="${id}">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(title)} over time">
      <line class="grid-line" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>
      ${rows.length > 1 ? `<polyline points="${points}" fill="none" stroke="var(--series)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>` : ""}
      ${values.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${rows.length === 1 ? 4 : 0}" fill="var(--series)"/>`).join("")}
      ${rows.map((r, i) => `<rect x="${(x(i) - Math.max(10, (W / rows.length) / 2)).toFixed(1)}" y="0" width="${Math.max(20, W / rows.length).toFixed(1)}" height="${H}" fill="transparent" data-tip="${esc(fmt(r.t) + ": " + format(values[i]))}" data-px="${(x(i) / W * 100).toFixed(2)}" data-py="${(y(values[i]) / H * 100).toFixed(2)}"/>`).join("")}
    </svg><div class="chart-tip"></div></div>
    <div class="axis"><span>${esc(fmt(rows[0].t))}</span>${rows.length > 1 ? `<span>${esc(fmt(rows[rows.length - 1].t))}</span>` : ""}</div></div>`;
}

function bindCharts() {

// Each render replaces the page, so return keyboard focus to the same control afterwards.
function focusedControl() {

  for (const attr of ["data-fix-item", "data-fix-tip", "data-reveal", "data-select", "data-select-many", "data-pane"]) {
    if (el.hasAttribute(attr)) return `[${attr}="${CSS.escape(el.getAttribute(attr))}"]`;
  }
  if (el.classList.contains("tab")) return `.tab[data-tab="${CSS.escape(el.dataset.tab)}"]`;

}

    askConfirm(`${fix.label}?`, fix.detail, fix.names || [title.replace(" can't update", "")], "Open Terminal", false, async () => {
      await api("/api/brew-remove", { id: itemId });

function jobResults(job) {
  const s = job.summary;
  if (job.running) return `<div class="result">${icon("refresh")}<span>Updating. You can keep using your Mac.</span></div>`;
  if (!s) return `<div class="result">${icon("warn")}<span>This stopped with an error. The log shows why.</span></div>`;
  const line = (ic, color, text) => `<div class="result"><span style="color:var(--${color})">${icon(ic)}</span><span>${text}</span></div>`;
  const out = [];
  if (s.updated) out.push(line("check", "good", `<strong>${plural(s.updated, "package")} updated.</strong>`));
  if (s.needs_password.length) out.push(line("key", "warn", `<strong>${esc(s.needs_password.join(", "))}</strong> install${s.needs_password.length === 1 ? "s" : ""} system-wide, so it needs your password. Finish in Terminal, where only macOS's sudo sees it.`));
  if (s.disabled.length) out.push(line("info", "violet", `<strong>${esc(s.disabled.join(", "))}</strong> can't update because Homebrew has stopped supporting ${s.disabled.length === 1 ? "it" : "them"}. The Developer page explains what to do.`));
  if (s.failed.length) out.push(line("x", "bad", `<strong>${esc(s.failed.join(", "))}</strong> failed. The log shows why.`));
  if (s.tools_problem) out.push(line("warn", "warn", `Homebrew mentioned Command Line Tools. If this keeps failing, run <code>xcode-select --install</code> in Terminal.`));
  if (!out.length) out.push(line("check", "good", "<strong>Nothing new to install.</strong>"));
  return out.join("");
}
async function watchJob(failures) {
  let job;
  try {
    job = await api("/api/job");
  } catch (error) {
    // A brief hiccup shouldn't end the dialog, but it mustn't spin forever either.
    if (failures < 5) { setTimeout(() => watchJob(failures + 1), 2000); return; }
    document.getElementById("job-summary").innerHTML = `<div class="result">${icon("warn")}<span>Lost contact with the update. Reopen Mac Health to check the result.</span></div>`;
    document.getElementById("job-actions").innerHTML = `<button class="btn" id="job-close">Close</button>`;
    return;
  }
  const log = document.getElementById("job-log");
  log.textContent = job.log;
  log.scrollTop = log.scrollHeight;
  document.getElementById("job-summary").innerHTML = jobResults(job);
  const s = job.summary || {};
  document.getElementById("job-actions").innerHTML = job.running ? "" :
    `${(s.needs_password || []).length ? `<button class="btn primary" id="brew-terminal">${icon("terminal")}Finish in Terminal</button>` : ""}
     <button class="btn" id="job-close">Close</button>`;
  if (job.running) { setTimeout(() => watchJob(0), 1000); return; }
  announce("Homebrew update finished.");
  await refresh();
}

async function refresh() {

  if (view.data.report) {
    const ids = new Set(view.data.actionable);

async function poll() {
  let wait = 4000;
  try {
    const status = await api("/api/status");
    if (status.scanning) wait = 1000;
    document.getElementById("progress").hidden = !status.scanning;
    if (view.scanning !== status.scanning) {
      view.scanning = status.scanning;
      if (!status.scanning || view.tab === "overview") render();
    }
    if (status.scanning) {
      document.getElementById("progress-stage").textContent = status.stage || "";
      document.getElementById("progress-fill").style.width = status.percent + "%";
      document.getElementById("progress-meter").setAttribute("aria-valuenow", status.percent);
    }
    if (view.wasScanning && !status.scanning) {
      view.wasScanning = false;
      await refresh();
      if (status.error) showError(status.error); else announce("Scan finished.");
    }
    view.wasScanning = status.scanning;
  } catch (error) {
    // One failed check must not end progress updates, so the next one still runs.
  } finally {
    setTimeout(poll, wait);
  }
}

  }
});
render();
refresh().catch(error => showError(error.message));
poll();
</script>
